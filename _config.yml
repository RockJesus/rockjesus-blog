# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: 'Alienware Hackintosh'
subtitle: '外星人黑苹果系统 👽 Apple MacOS by RockJesus'
description: 'Alienware Hackintosh 👽 Apple MacOS by RockJesus 外星人黑苹果系统'
keywords: 'Alienware,Hackintosh,RockJesus,外星人,黑苹果,苹果系统,macOS,OS,双系统,核显,独显,双显卡,笔记本,hexo,butterfly,apple'
author: RockJesus
language: zh-CN
timezone: 'Asia/Shanghai'

# Version 站点版本号（以 GitHub Release 为准，v1.0.x 三段式递增：1.0.3 → 1.0.4；由流水线自动打 tag 并发布 GitHub Release，tag=v${version}）
version: 1.1.5

# URL
## If your site is put in a subdirectory, set url as 'http://example.com/child' and root as '/child/'
url: http://www.rockjesus.cn
root: /
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Sort by descending date)
index_generator:
  path: ''
  per_page: 0
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## Use post's date for updated date unless set in front-matter
use_date_for_updated: false

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: butterfly

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/RockJesus/RockJesus.github.io.git
  branch: master

# hexo-generator-sitemap
sitemap:
  path: sitemap.xml

# hexo-generator-baidu-sitemap
baidusitemap:
  path: baidusitemap.xml

# hexo-generator-search
search:
  path: search.xml
  field: post
  content: true

# hexo-helper-live2d
live2d:
  enable: true
  model:
    use: live2d-widget-model-miku
  display:
    position: right
    width: 200
    height: 400
    hOffset: 150
    vOffset: -68
  mobile:
    show: false
    scale: 0.5

# marked renderer options (default)
marked:
  gfm: true
  pedantic: false
  breaks: false
  smartLists: true
  smartypants: false
  modifyAnchors: ''
  autolink: true
