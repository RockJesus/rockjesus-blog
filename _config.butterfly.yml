# Butterfly 主题配置（rockjesus.cn 复刻版）
# 覆盖 themes/butterfly/_config.yml 的默认值，重建发布站 RockJesus.github.io 的原始效果

# Menu 菜单
menu:
  主页: / || svg:home
  加入我们||svg:users:
    QQ群: /img/qq.png || fab fa-qq
    公众号: /img/gzh.jpg || fab fa-weixin
    Github: https://github.com/rockjesus || fab fa-github
    Gitee: https://gitee.com/rockjesus || fab fa-github-alt
  打赏||svg:gift:
    微信: /img/wx.png || fab fa-weixin
    支付宝: /img/zfb.png || fab fa-alipay
    赞赏: /img/zsm.png || svg:qrcode
  安装: /img/az.jpg || svg:download
  黑果小兵: https://blog.daliansky.net/ || svg:heart
  元宇宙||svg:planet:
    Sandbox: https://www.sandbox.game/ || svg:cloud
    Decentraland: https://decentraland.org/ || fa-brands fa-playstation
    画板: https://weavesilk.com/ || fab fa-firefox
    游戏: https://www.yikm.net/ || fab fa-steam
    钢琴: https://www.autopiano.cn/ || svg:keyboard
    地图: https://cybermap.kaspersky.com/ || svg:map
    SpaceX: https://www.spacex.com/ || svg:rocket
    NASA: https://www.nasa.gov/multimedia/nasatv/index.html#public || svg:earth
    监控: https://www.skylinewebcams.com/ || svg:camera
  留言/社交||svg:sms:
    留言板: /messageboard/ || svg:sms
    Chat: https://gitter.im/Alienware-hackintosh/community || fab fa-gitlab
    抖音: /img/dou.png || iconfont icon-external_tiktok
    视频号: /img/sph.jpg || fas fa-video
    电影: /img/dy.jpg || fas fa-film

# Social 侧边栏社交图标
social:
  fab fa-github: https://github.com/rockjesus || Github
  fab fa-github-alt: https://gitee.com/rockjesus || gitee
  fab fa-qq: /img/qq.png || 外星人黑苹果QQ群
  fab fa-weixin: /img/gzh.jpg || 外星人黑苹果公众号
  fab fa-tiktok: /img/dou.png || 抖音
  fas fa-video: /img/sph.jpg || 微信视频号
  fas fa-film: /img/dy.jpg || 电影公众号
  fab fa-apple: /img/az.jpg || 黑苹果远程安装
  fas fa-heartbeat: https://blog.daliansky.net/ || 黑果小兵
  fas fa-sms: /messageboard/ || 留言板
  iconfont icon-aliens-fill: https://gitter.im/Alienware-hackintosh/community || chat
  fas fa-rss: /atom.xml || RSS 订阅

# Site verification 站点验证
site_verification:
  - name: google-site-verification
    content: wcu3_1CqmZW-eiZzYE1VkXQ83NfhxXYyUYjqofL2s98
  - name: baidu-site-verification
    content: a9e08ec56eb07a3e283226ce7db68098

# Analytics 统计
baidu_analytics: a9e08ec56eb07a3e283226ce7db68098
# google_analytics 留空：主题会在 <head> 里同步注入 gtag/js（实测 176KB，
# 是首屏第二大资源），且它与渲染无关。改为 inject.head 里的内联 stub +
# 页面空闲后再加载，统计行为不变，首屏不再为它让路。
google_analytics:

# Highlight 代码高亮主题
highlight_theme: mac

# Theme color 主题色（紫色系）
theme_color:
  enable: true
  main: rgba(120,47,216,0.7)
  paginator: rgba(193,30,163,0.7)
  button_hover: rgba(193,30,163,0.6)
  text_selection: rgba(120,47,216,0.7)
  link_color: rgba(120,47,216,0.7)
  hr_color: rgba(120,47,216,0.7)
  meta_color: rgba(120,47,216,0.7)
  blockquote_padding_color: '#000'
  blockquote_background_color: '#000'
  code_foreground: '#000'
  code_background: '#000'
  toc_color: '#000'

# Beautify 美化
beautify:
  enable: true
  field: site
  title-prefix-icon: '\f0c1'
  title-prefix-icon-color: '#F47466'

# Favicon 站点图标
favicon: /img/apple.png

# Background 全站背景
background: url(/img/oc.webp)

# Avatar 头像
avatar:
  img: /img/black.png
  effect: false

# Image (文章 / 页面顶部大图)
index_img: /img/header_home.webp
default_top_img: /img/header_post.webp

# Error image 图片加载失败时显示
error_img:
  flink: /img/4040.gif
  post_page: /img/404.gif

# 404 页面
error_404:
  enable: true
  subtitle: 'Page Not Found jump to https://github.com/RockJesus'
  background: /img/404.gif

# Cover 文章封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  position: right

# Post meta 文章信息
post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    date_type: both
    date_format: date
    categories: true
    tags: false
    label: true

# Toc 文章目录
toc:
  post: false
  page: false
  number: true
  expand: false
  style: 1

# Post copyright 版权
post_copyright:
  enable: true
  decode: false
  author_href: https://rockjesus.cn
  license: RockJesus
  license_url: https://github.com/rockjesus

# Reward 打赏
reward:
  enable: true
  comment: 原创不易，您的支持是鼓励我持续创作的力量！
  QR_code:
    - img: /img/wx.png
      link: /img/wx.png
      text: 微信打赏
    - img: /img/zfb.png
      link: /img/zfb.png
      text: 支付宝打赏
    - img: /img/zsm.png
      link: /img/zsm.png
      text: 赞赏码打赏

# Comments 评论
comments:
  use: ['Valine', 'Gitalk']
  text: true
  lazyload: true
  count: false
  card_post_count: false

# Valine
valine:
  appId: RLc30HWPtO9O8AP4i2uMDedp-gzGzoHsz
  appKey: 2FWO8VTCwsA1gY7DQMBiJDvY
  placeholder: 说点什么吧
  avatar: hide
  guest_info: nick,mail,link
  pageSize: 10
  lang: zh-CN
  recordIP: false
  serverURLs: ''
  bg: /img/foot.gif
  emojiCDN: ''
  enableFlag: false
  flagCDN: ''
  requiredFields:
  defaultAvatar: ''
  visitor: true
  option:

# Gitalk
gitalk:
  client_id: f73ad14b667643d52ef5
  client_secret: # 仓库公开前已清空（原值已轮换失效），如需启用请重新填写
  repo: RockJesus.github.io
  owner: RockJesus
  admin: ['RockJesus']
  option:

# Chat 聊天
chat_btn: true
gitter:
  # sidecar.gitter.im 已 NXDOMAIN；聊天按钮（#chat_btn）由 player.js 接管为豆包面板，
  # 不再需要 Gitter 的 sidecar 脚本。
  enable: false
  room: Alienware-hackintosh/community

# Footer 页脚
footer:
  owner:
    enable: true
    since: 2019
  custom_text: <span class="rj-brand-mark"><span class="rj-brand-mark__col"><i class="rj-brand-mark__logo rj-brand-mark__logo--aw" aria-hidden="true"></i>ALIENWARE</span><span class="rj-brand-mark__x" aria-hidden="true">×</span><span class="rj-brand-mark__col"><i class="rj-brand-mark__logo rj-brand-mark__logo--apple" aria-hidden="true"></i>APPLE</span></span><p><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://alienware.com"><img alt="Hardware Alienware" src="https://img.shields.io/badge/Hardware-Alienware-silver.svg?logo=Hackaday"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://www.apple.com/macos"><img alt="platform MacOS10/13" src="https://img.shields.io/badge/platform-MacOS10/13-red.svg?logo=apple"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://www.microsoft.com/en-us/windows/"><img alt="platform Windows11" src="https://img.shields.io/badge/platform-Windows11-blue.svg?logo=windows"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/acidanthera/OpenCorePkg"><img alt="Bootloader Opencore" src="https://img.shields.io/badge/Bootloader-Opencore-silver.svg?logo=OpenCollective"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/CloverHackyColor/CloverBootloader"><img alt="Bootloader Clover" src="https://img.shields.io/badge/Bootloader-Clover-green.svg?logo=4chan"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/acidanthera"><img alt="Credits Acidanthera" src="https://img.shields.io/badge/Credits-Acidanthera-purple.svg?logo=Academia"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://tonymacx86.com"><img alt="Credits TonymacX86" src="https://img.shields.io/badge/Credits-TonymacX86-green.svg?logo=Tesla"></a><a style="margin-inline:3px" target="_blank" rel="noopener norefe