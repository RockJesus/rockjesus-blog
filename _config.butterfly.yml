w.svg?logo=wechat"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="/img/az.jpg"><img alt="黑苹果 远程安装" src="https://img.shields.io/badge/黑苹果-远程安装-purple.svg?logo=Atom"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://gitter.im/Alienware-hackintosh/community"><img alt="Chatroom Gitter" src="https://img.shields.io/badge/Chatroom-Gitter-9cf.svg?logo=gitter"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/RockJesus"><img alt="GitHub Stars" src="https://img.shields.io/github/stars/rockjesus.svg?logo=ApacheSpark"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/RockJesus"><img alt="GitHub Followers" src="https://img.shields.io/github/followers/RockJesus.svg?logo=SouthwestAirlines&color=purple"></a><a style="margin-inline:3px" target="_blank" rel="noopener noreferrer" href="https://github.com/RockJesus/Alienware-Hackintosh"><img alt="GitHub Downloads RockJesus Alienware-Opencore-Theme" src="https://img.shields.io/github/downloads/RockJesus/Alienware-Opencore-Theme/total.svg?logo=DocuSign"></a></p>
  copyright: true

# Copy 复制
copy:
  enable: true
  copyright:
    enable: true
    limit_count: 50

# Local Search 本地搜索
local_search:
  enable: false
  preload: false

# Display mode 显示模式
display_mode: dark

# Subtitle 打字机
subtitle:
  enable: true
  effect: true
  startDelay: 300
  typeSpeed: 70
  backSpeed: 30
  loop: true
  sub:
    - Alienware Hackintosh
    - 外星人全系黑苹果

# Darkmode
darkmode:
  enable: true
  button: true
  autoChangeMode: false

# Aside 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: false
    tag: true
    category: true
  card_author:
    enable: true
    description: 'Technical  Artist 🛸 of  Alienware  👽  MacOS 🖥 外星人黑苹果系统 💻'
    button:
      enable: true
      icon: iconfont icon-aliens-fill
      text: Follow Me
      link: https://github.com/rockjesus
  card_announcement:
    enable: true
    content: 'Life is all about the journey ∞#24'
  card_recent_post:
    enable: false
    limit: 5
    sort: date
  card_categories:
    enable: false
    limit: 8
    expand: none
  card_tags:
    enable: false
    limit: 40
    color: false
  card_archives:
    enable: false
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: false
    last_push_date: false
    sort_order: 3

# Busuanzi 不蒜子（服务已失效，统计改由 player.js + Upstash 自有计数接管）
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# Pjax
pjax:
  enable: true

# Canvas nest 线条背景（已关闭：主页背景为静态图，不再叠加鼠标互动线条特效）
canvas_nest:
  enable: false

# 右下角按钮距底部距离
rightside-bottom: -1px

# Lazyload 图片懒加载
lazyload:
  enable: true
  field: site

# Fancybox 灯箱
fancybox: true

# Aplayer 播放器
aplayerInject:
  enable: true
  per_page: true

# 首页卡片摘要
# 1 只显示 description｜2 有 description 用它、否则截断正文｜3 一律截断正文
# 用 3 时 strip_html 会把开头那几行「参考链接」的裸 URL 直接截进摘要，
# 首页会出现一整段 https://bbs.pcbeta.com/...（2026-11-01 修）
index_post_content:
  method: 2
  length: 500

# Inject 注入
inject:
  head:
    - <link rel="stylesheet" href="/css/tokens.css?v=1.5.6">
    - <link rel="stylesheet" href="/css/custom.css?v=1.9.20">
    - <link rel="stylesheet" href="//at.alicdn.com/t/font_2875562_kkb6ns0eiij.css">
    - <script src="/js/player.js?v=1.8.23" defer></script>
    - "<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-MBJRWEHZ50');addEventListener('load',function(){var go=function(){var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-MBJRWEHZ50';document.head.appendChild(s);};window.requestIdleCallback?requestIdleCallback(go,{timeout:3000}):setTimeout(go,1500);});document.addEventListener('pjax:complete',function(){gtag('config','G-MBJRWEHZ50',{page_path:location.pathname});});</script>"
  bottom:
    - <div id="site-player"></div>
    - <meta name="google-site-verification" content="wcu3_1CqmZW-eiZzYE1VkXQ83NfhxXYyUYjqofL2s98" />
    # 和风天气挂件已下线：widget.qweather.net 域名现在解析不到（NXDOMAIN），
    # 脚本每页都加载失败并报控制台错误，故连同 /js/weather.js 配置一起移除。
    - <script src="/js/live2d-guard.js?v=1.0.2" defer></script>

# CDN
CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  version: false
  option:
    aplayer_css: /css/AA.css
    fontawesomeV6: /css/fa-subset.css
