name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx hexo g

      # 歌单瘦身：剔掉无直链（版权/会员限制）的曲目，产物 gzip 184KB→124KB。
      # hexo filter 在 CI 里会跟静态资源写入抢时序（public 为空，existsSync 常扑空），
      # 所以这里作为确定性的一步显式再跑一次（幂等）。
      - name: Trim playlist asset
        run: node scripts/trim_playlist.js

      # 直链可用性探测：trim 只剔「根本没有 url」的（3064→961），但这 961 条里
      # 只有 130 条真能读出字节，其余 831 条 CDN 直接 403（版权/会员限制）。
      # 实测该比例与 vkey 年龄无关（08:29 与 10:43 两版歌单结果完全一致），
      # 也与地域无关（本机与 GitHub runner 都是 130/961），是稳定的死链分布。
      # 不筛的话播放器每隔几首就撞一次死链、报错跳歌。
      # 单条只读前 2KB 即断，32 并发约 25~35s，可播数低于 PROBE_MIN 时自动回退不写。
      - name: Probe dead stream links
        env:
          PROBE_CONCURRENCY: '32'
          PROBE_MIN: '40'
        run: node scripts/probe_playlist.js public/data/playlist.json

      - name: Ensure domain & nojekyll
        run: |
          echo "rockjesus.cn" > public/CNAME
          touch public/.nojekyll

      - name: Deploy to RockJesus.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: RockJesus/RockJesus.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: false
          keep_files: false
          user_name: RockJesus
          user_email: RockJesus@users.noreply.github.com

      - name: Auto tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2; exit}' _config.yml)
          if [ -z "$VERSION" ]; then echo "no version in _config.yml, skip"; exit 0; fi
          TAG="v${VERSION}"
          API="https://api.github.com/repos/RockJesus/rockjesus-blog"
          if curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "release ${TAG} already exists, skip"
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/releases" \
              -d "{\"tag_name\":\"$TAG\",\"target_commitish\":\"main\",\"name\":\"$TAG\",\"body\":\"自动发布 v${VERSION} · $(date -u +'%Y-%m-%d %H:%M UTC') · commit ${GITHUB_SHA}\"}"
            echo "release ${TAG} created"
          fi
