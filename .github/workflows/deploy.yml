name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx hexo g

      - name: Ensure domain & nojekyll
        run: |
          echo "rockjesus.cn" > public/CNAME
          touch public/.nojekyll

      - name: Deploy to RockJesus.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: RockJesus/RockJesus.github.io
          publish_branch: master
          publish_dir: ./public
          force_orphan: false
          keep_files: false
          user_name: RockJesus
          user_email: RockJesus@users.noreply.github.com

      - name: Auto tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2; exit}' _config.yml)
          if [ -z "$VERSION" ]; then echo "no version in _config.yml, skip"; exit 0; fi
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "自动发布 v${VERSION} · $(date -u +'%Y-%m-%d %H:%M UTC') · commit ${{ github.sha }}"
            echo "release ${TAG} created"
          else
            echo "release ${TAG} already exists, skip"
          fi
