name: QQ Music Sync
on:
  schedule:
    # vkey 有效期约 22 小时（musicu.fcg 返回 expiration=80400），每天两次足够覆盖。
    - cron: '0 3,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: qq-music-sync
      cancel-in-progress: true
    steps:
      # 必须用 DEPLOY_TOKEN 而不是默认 GITHUB_TOKEN：GitHub 规定由
      # GITHUB_TOKEN 推送的提交不会触发其他 workflow，导致 Deploy Blog
      # 不启动、刷新后的歌单永远上不了线（2026-11-12 两次刷新就是这样
      # “成功”但线上仍是旧 vkey，最终全部 403）。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPLOY_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch QQ playlist vkeys
        run: python tools/sync_qq_music.py source/data/playlist.json
      - name: Commit if changed
        run: |
          git config user.name "RockJesus"
          git config user.email "rockjesus@users.noreply.github.com"
          git add source/data/playlist.json
          if git diff --cached --quiet; then
            echo "playlist unchanged, skip commit"
          else
            git commit -m "chore(music): 刷新 QQ 歌单直链"
            git push
          fi
