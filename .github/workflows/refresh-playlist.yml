name: Refresh Music Playlist
on:
  schedule:
    # 每小时对齐素材仓（素材仓 cron 每 2h 刷新 vkey）；有变化才写，无变化零副作用。
    # vkey 有效期有限，同步越及时线上可播率越高；前端另有每 10 分钟轮询兜底。
    - cron: '30 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 对比素材仓歌单，有更新则写回源码仓备份
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const https = require('https');
          const tk = process.env.GH_TOKEN;
          function get(url, headers) {
            return new Promise((res, rej) => {
              https.get(url, { headers: headers || {} }, r => {
                let d = ''; r.on('data', c => d += c); r.on('end', () => res({ ok: r.statusCode >= 200 && r.statusCode < 300, t: d }));
              }).on('error', rej);
            });
          }
          (async () => {
            let remote = null;
            try {
              const r = await get('https://api.github.com/repos/RockJesus/rockjesus/contents/music/playlist.json?ref=main', {
                'Authorization': 'Bearer ' + tk, 'User-Agent': 'rj-refresh', 'Accept': 'application/vnd.github+json'
              });
              if (r.ok) remote = JSON.parse(Buffer.from(JSON.parse(r.t).content, 'base64').toString('utf8'));
            } catch (e) { console.error('fetch remote failed:', e.message); }
            if (!remote || !remote.updated) { console.log('NO_REMOTE_PLAYLIST'); process.exit(0); }
            let local = {};
            try { local = JSON.parse(fs.readFileSync('source/data/playlist.json', 'utf8')); } catch (e) {}
            if (local.updated === remote.updated) {
              console.log('PLAYLIST_UP_TO_DATE', remote.updated);
              process.exit(0);
            }
            fs.writeFileSync('source/data/playlist.json', JSON.stringify(remote));
            console.log('PLAYLIST_UPDATED', local.updated || '(none)', '->', remote.updated, '| tracks:', remote.tracks ? remote.tracks.length : 0);
            const exec = require('child_process').execSync;
            exec("git config user.name 'RockJesus'");
            exec("git config user.email 'rockjesus@users.noreply.github.com'");
            exec('git add source/data/playlist.json');
            // 不能带 [skip ci]：GITHUB_TOKEN 无权写另一个仓库（RockJesus.github.io），
            // 所以「同步部署仓」那一步一直 403；歌单只能靠源码仓提交触发 deploy.yml 发布。
            exec('git -c commit.gpgsign=false commit -m "chore: 刷新音乐歌单" -q');
            exec('git push https://x-access-token:' + tk + '@github.com/RockJesus/rockjesus-blog.git main -q');
            console.log('SOURCE_PUSHED');
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      # 直写部署仓这一步已删除：GITHUB_TOKEN 无权写 RockJesus.github.io（跨仓库必然 403），
      # 以前靠 continue-on-error 硬吞；歌单现在由源码仓提交触发 deploy.yml 统一发布。
      - name: 说明（部署走 deploy.yml）
        run: echo "歌单已写入源码仓，部署由 Deploy Blog 完成"
