name: Probe Test (temp)

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/probe-test.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 海外 IP 直链可播率实测（只报告不改写）
        env:
          PROBE_DRY: '1'
        run: node scripts/probe_playlist.js source/data/playlist.json
      - name: 单条对照（首条可播 / 首条死链）
        run: |
          node -e '
            const fs=require("fs"),https=require("https"),{URL}=require("url");
            const p=JSON.parse(fs.readFileSync("source/data/playlist.json","utf8"));
            const withUrl=p.tracks.filter(t=>t&&t.url);
            console.log("样本首条:", withUrl[0].name, withUrl[0].url.slice(0,80));
            const u=new URL(withUrl[0].url);
            https.get(u,{headers:{Range:"bytes=0-2047","User-Agent":"Mozilla/5.0 Chrome/126.0",Referer:"https://y.qq.com/"}},r=>{
              console.log("status",r.statusCode,"| x-cache",r.headers["x-cache"]||"-","| server",r.headers["server"]||"-");
              r.resume();
            }).on("error",e=>console.log("err",e.message));
          '
